name: Monitor RKO group changes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/rko_probe.py"
      - "tools/rko_diff.py"
      - ".github/workflows/rko-probe.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: rko-monitor
  cancel-in-progress: false

# Manual verification trigger: 2026-09-12 punctuation test.
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Collect current RKO groups
        run: python tools/rko_probe.py

      - name: Compare with previous snapshot
        id: diff
        shell: bash
        run: |
          python tools/rko_diff.py
          cat rko_diff_status.env
          source rko_diff_status.env
          echo "changes=$CHANGES_FOUND" >> "$GITHUB_OUTPUT"
          echo "count=$CHANGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "initialized=$INITIALIZED" >> "$GITHUB_OUTPUT"

      - name: Upload monitoring result
        uses: actions/upload-artifact@v4
        with:
          name: rko-monitor-result
          path: |
            rko_probe_output.json
            rko_changes.md
            rko_diff_status.env
          if-no-files-found: error

      - name: Create GitHub issue when groups changed
        if: steps.diff.outputs.changes == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Изменения групп РКО — ${DATE}" \
            --body-file rko_changes.md

      - name: Save new snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rko_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "Update RKO group snapshot"
            git pull --rebase origin main
            git push origin main
          fi
