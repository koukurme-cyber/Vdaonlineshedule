name: One-off RKO offline diff check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff_rko_offline_check.yml'

permissions:
  contents: write

jobs:
  check:
    if: github.event.head_commit.message == 'Check live RKO offline diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium

      - name: Scrape live offline table and compare to snapshot
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          URL = 'https://adultchildren.ru/groups/offline_list/'
          SNAP = Path('data/rko_snapshot.json')
          OUT = Path('rko_offline_live_diff.json')

          FIELD_MAP = {
              'название_группы': 'name',
              'страна': 'country',
              'город': 'city',
              'дата_регистрации': 'registration_date',
              'адрес_проведения': 'address',
              'расписание': 'schedule',
              'пояснение': 'note',
              'способ_связи': 'web',
              'дата_рождения': 'group_birthday',
              'телефон_группы': 'phone',
              'дополнительный_e_mail': 'public_email',
              'координата_на_карте': 'coordinates',
          }

          def clean(value):
              if value is None:
                  return ''
              soup = BeautifulSoup(str(value), 'lxml')
              return re.sub(r'\s+', ' ', soup.get_text(' ', strip=True)).strip()

          async def scrape():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(locale='ru-RU')
                  page = await context.new_page()
                  xhr = []
                  def on_response(response):
                      try:
                          if response.request.resource_type in {'xhr','fetch'} and response.url not in xhr:
                              xhr.append(response.url)
                      except Exception:
                          pass
                  page.on('response', on_response)
                  await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  try:
                      await page.wait_for_load_state('networkidle', timeout=15000)
                  except Exception:
                      pass
                  await page.wait_for_timeout(3000)
                  ninja = next((u for u in xhr if 'ninja_tables_public_action' in u and 'get-all-data' in u), None)
                  if not ninja:
                      raise RuntimeError('Ninja Tables data request not found')
                  response = await page.request.get(ninja, timeout=60000)
                  if not response.ok:
                      raise RuntimeError(f'HTTP {response.status}')
                  payload = await response.json()
                  rows = []
                  for item in payload:
                      values = item.get('value', {}) if isinstance(item, dict) else {}
                      if not isinstance(values, dict):
                          continue
                      rec = {'source_id': values.get('___id___')}
                      for src, dst in FIELD_MAP.items():
                          val = clean(values.get(src, ''))
                          if val:
                              rec[dst] = val
                      if rec.get('source_id') not in (None, ''):
                          rows.append(rec)
                  await browser.close()
                  return rows

          live = asyncio.run(scrape())
          snap = json.loads(SNAP.read_text(encoding='utf-8'))
          old = snap.get('pages', {}).get('offline', [])

          om = {str(r.get('source_id')): r for r in old if r.get('source_id') not in (None,'')}
          nm = {str(r.get('source_id')): r for r in live if r.get('source_id') not in (None,'')}

          added = [nm[k] for k in sorted(nm.keys() - om.keys(), key=lambda x: int(x) if x.isdigit() else x)]
          removed = [om[k] for k in sorted(om.keys() - nm.keys(), key=lambda x: int(x) if x.isdigit() else x)]
          modified = []
          fields = ['name','country','city','address','schedule','note','web','group_birthday','phone','public_email','coordinates','registration_date']
          for k in sorted(om.keys() & nm.keys(), key=lambda x: int(x) if x.isdigit() else x):
              changes = {}
              for f in fields:
                  if om[k].get(f, '') != nm[k].get(f, ''):
                      changes[f] = {'before': om[k].get(f, ''), 'after': nm[k].get(f, '')}
              if changes:
                  modified.append({'source_id': k, 'identity': {'name': nm[k].get('name',''), 'city': nm[k].get('city','')}, 'changes': changes})

          result = {
              'source_url': URL,
              'baseline': 'data/rko_snapshot.json',
              'live_count': len(live),
              'baseline_count': len(old),
              'added': added,
              'removed': removed,
              'modified': modified,
          }
          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rko_offline_live_diff.json
          git commit -m "Capture live RKO offline diff"
          git push
