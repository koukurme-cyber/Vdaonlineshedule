name: Apply live RKO Astana data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff_rko_astana.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply live RKO Astana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep only the current Astana group
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('live_groups.tsv')
          lines = path.read_text(encoding='utf-8').splitlines()

          current = 'Казахстан\tАстана\tГород Астана\tУлица Алексея Петрова 14/3. Контакты: +77019140958. Telegram: https://t.me/vda_astana. Email: aygerimamman@mail.ru\tВоскресенье 14:00–15:30'

          out = []
          removed = []
          inserted = False
          for line in lines:
              cols = line.split('\t')
              if len(cols) >= 3 and cols[0] == 'Казахстан' and cols[1] in {'Астана', 'Нур-султан'}:
                  removed.append(line)
                  if not inserted:
                      out.append(current)
                      inserted = True
                  continue
              out.append(line)

          if not removed:
              raise SystemExit('No Astana/Nur-sultan rows found to replace')

          print('Removed rows:')
          for row in removed:
              print(row)
          print('Inserted row:')
          print(current)

          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_groups.tsv
          git diff --cached --check
          git commit -m "Use current RKO Astana group"
          git push
